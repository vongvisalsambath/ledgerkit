name: Release

# Publishes LedgerKit, LedgerKit.PostgreSql, LedgerKit.Cli to nuget.org when a version tag (v0.1.0, v0.2.0, ...) is pushed.
# Uses NuGet Trusted Publishing: no API key is stored anywhere. nuget.org trusts this repository and this
# workflow file (release.yml) through a policy on the owner's nuget.org account, and issues a key that lasts an hour.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish; must match the version in the project file, e.g. 0.1.0"
        required: true

permissions:
  contents: read

# Actions are pinned to commits (the tag is in the comment), so a moved tag can't change what runs here.
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # lets GitHub prove to nuget.org which repository and workflow is publishing
    services:
      postgres:
        image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_USER: ledgerkit_test
          POSTGRES_PASSWORD: ledgerkit_test
          POSTGRES_DB: ledgerkit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledgerkit_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LEDGERKIT_TEST_DB: Host=localhost;Username=ledgerkit_test;Password=ledgerkit_test;Database=ledgerkit_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: ledgerkit
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: The requested version matches the package version
        working-directory: ledgerkit
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="$(grep -oP '(?<=<Version>)[^<]+' src/LedgerKit/*.csproj)"
          want="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          echo "asked for $want, package $v"
          test "$v" = "$want"
      - working-directory: ledgerkit
        run: dotnet test --configuration Release
      - name: Pack
        working-directory: ledgerkit
        run: |
          dotnet pack src/LedgerKit -c Release -o artifacts
          dotnet pack src/LedgerKit.PostgreSql -c Release -o artifacts
          dotnet pack src/LedgerKit.Cli -c Release -o artifacts
      - name: Log in to nuget.org (short-lived key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: vongvisalsambath
      - name: Publish
        working-directory: ledgerkit
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
